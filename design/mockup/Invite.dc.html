<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App invite email</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="s1.css">
<link rel="stylesheet" href="ds/super1/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#00b4ff}a:hover{color:#5fd0ff}
</style>
</helmet>
<div class="s1" lang="{{lang}}" style="width: 600px; height: 860px; box-sizing: border-box; background: #0f1115; display: flex; flex-direction: column;">
  <div style="padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: inset 0 -1px 0 var(--hairline);">
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
      <span style="font: 600 15px/20px var(--font-sans);">{{t.subject}}</span>
      <span style="font: 500 13px/18px var(--font-sans); color: var(--text-secondary);">SUPER1 · hello@super1.app → ivan.petrov@mail.ru</span>
    </div>
    <div class="s1-seg">
      <sc-for list="{{langs}}" as="l" hint-placeholder-count="3"><button type="button" aria-pressed="{{l.pressed}}" onClick="{{l.pick}}" lang="{{l.code}}">{{l.label}}</button></sc-for>
    </div>
  </div>

  <div style="flex: 1; padding: 36px 48px; display: flex; flex-direction: column; gap: 24px; background: #000000;">
    <img src="/_blob/398b8f14610abf876aef8dbb1e7417d2" alt="SUPER1" style="height: 30px; width: auto; align-self: flex-start;">
    <h1 class="s1-largetitle" style="font-size: 32px; line-height: 40px;">{{t.greet}}</h1>
    <p style="margin: 0; font: 400 17px/26px var(--font-sans); color: var(--text-secondary);">{{t.body}}</p>
    <a href="#open" class="s1-btn s1-btn--primary s1-btn--lg" style="align-self: flex-start; padding: 0 28px;">{{t.button}}</a>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font: 600 13px/18px var(--font-sans); color: var(--text-secondary);">{{t.codeLine}}</span>
      <span class="s1-num" style="font: 700 34px/40px var(--font-sans); letter-spacing: 0.18em;">482 913</span>
      <span style="font: 500 13px/18px var(--font-sans); color: var(--text-tertiary);">{{t.codeNote}}</span>
    </div>
    <div class="s1-card" style="padding: 20px; display: flex; flex-direction: column; gap: 12px;">
      <span style="font: 600 13px/18px var(--font-sans); color: var(--text-secondary);">{{t.planTitle}}</span>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;"><span class="s1-headline">{{t.plan}}</span><span class="s1-pill s1-pill--active">{{t.active}}</span></div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; box-shadow: inset 0 1px 0 var(--hairline); padding-top: 12px;"><span style="font: 500 15px/20px var(--font-sans); color: var(--text-secondary);">{{t.tag}}</span><span class="s1-num" style="font: 700 17px/22px var(--font-sans); letter-spacing: 0.12em;">004417</span></div>
      <div style="display: flex; align-items: center; gap: 10px; box-shadow: inset 0 1px 0 var(--hairline); padding-top: 12px;"><span class="s1-disc s1-disc--pt" style="width: 32px; height: 32px;"><svg class="s1-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 16px; height: 16px;"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span><span style="font: 500 15px/20px var(--font-sans);">{{t.coach}}</span></div>
    </div>
    <p style="margin: auto 0 0; font: 500 12px/18px var(--font-sans); color: var(--text-tertiary);">{{t.footer}}</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":600,"height":860}}'>
var T = {
  en: { subject: "Your SUPER1 app is ready", greet: "Welcome to Superfit, Ivan", body: "Your membership is set up. Open the app to see your plan, your training and the café menu.", button: "Open the SUPER1 app", codeLine: "Or sign in with this code", codeNote: "Works for 10 minutes", planTitle: "Your membership", plan: "1 Month · Mon 12 Oct → Wed 11 Nov", active: "Active", tag: "Check-in tag", coach: "Sunman will message you about training.", footer: "Superfit · Chalong, Phuket. You're getting this because you joined at the counter." },
  th: { subject: "แอป SUPER1 ของคุณพร้อมแล้ว", greet: "ยินดีต้อนรับสู่ Superfit คุณ Ivan", body: "สมาชิกของคุณพร้อมใช้งานแล้ว เปิดแอปเพื่อดูแพ็กเกจ โปรแกรมเทรน และเมนูคาเฟ่", button: "เปิดแอป SUPER1", codeLine: "หรือเข้าสู่ระบบด้วยรหัสนี้", codeNote: "ใช้ได้ 10 นาที", planTitle: "สมาชิกของคุณ", plan: "1 เดือน · จ. 12 ต.ค. → พ. 11 พ.ย.", active: "ใช้งานอยู่", tag: "แท็กเช็กอิน", coach: "Sunman จะติดต่อคุณเรื่องการเทรน", footer: "Superfit · ฉลอง ภูเก็ต คุณได้รับอีเมลนี้เพราะสมัครที่เคาน์เตอร์" },
  ru: { subject: "Приложение SUPER1 готово", greet: "Добро пожаловать в Superfit, Ivan", body: "Ваш абонемент оформлен. Откройте приложение, чтобы увидеть абонемент, тренировки и меню кафе.", button: "Открыть приложение SUPER1", codeLine: "Или войдите с этим кодом", codeNote: "Действует 10 минут", planTitle: "Ваш абонемент", plan: "1 месяц · пн 12 окт → ср 11 нояб", active: "Активен", tag: "Ключ для входа", coach: "Sunman свяжется с вами насчёт тренировок.", footer: "Superfit · Чалонг, Пхукет. Вы получили это письмо, потому что зарегистрировались на ресепшене." }
};
var LANGS = [{ code: "en", label: "EN" }, { code: "th", label: "ไทย" }, { code: "ru", label: "RU" }];
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { lang: "ru" }; }
  renderVals() {
    var self = this, s = this.state;
    return {
      lang: s.lang, t: T[s.lang],
      langs: LANGS.map(function (l) { return { code: l.code, label: l.label, pressed: s.lang === l.code, pick: function () { self.setState({ lang: l.code }); } }; })
    };
  }
}
</script>
</body>
</html>
