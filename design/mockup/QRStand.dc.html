<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Counter QR stand</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="s1.css">
<link rel="stylesheet" href="ds/super1/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#00b4ff}a:hover{color:#5fd0ff}
</style>
</helmet>
<div class="s1" style="width: 560px; height: 780px; box-sizing: border-box; padding: 48px 44px 40px; display: flex; flex-direction: column; align-items: center; gap: 28px; background: #000000; border-radius: 28px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08);">
  <img src="/_blob/398b8f14610abf876aef8dbb1e7417d2" alt="SUPER1" style="height: 36px; width: auto;">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;">
    <h1 class="s1-largetitle" style="font-size: 40px; line-height: 46px;">Welcome to Superfit</h1>
    <p lang="th" style="margin: 0; font: 500 18px/27px var(--font-sans); color: var(--text-secondary);">ยินดีต้อนรับสู่ Superfit</p>
    <p lang="ru" style="margin: 0; font: 500 18px/24px var(--font-sans); color: var(--text-secondary);">Добро пожаловать в Superfit</p>
  </div>
  <div style="padding: 20px; background: #ffffff; border-radius: 28px; display: grid; place-items: center;">
    <img src="/_blob/9249ea48337703f5addad5fcfa52473f" alt="QR code to super1.app/join" style="width: 240px; height: 240px; display: block;">
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
    <span style="font: 700 24px/30px var(--font-sans); letter-spacing: -0.016em;">Scan to join</span>
    <span style="font: 500 15px/20px var(--font-sans); color: var(--s1-blue);">super1.app/join</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%;">
    <div class="s1-card" style="padding: 14px; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center;"><span style="font: 700 13px/1 var(--font-sans); color: var(--s1-blue);">1</span><span style="font: 600 15px/20px var(--font-sans);">Scan</span></div>
    <div class="s1-card" style="padding: 14px; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center;"><span style="font: 700 13px/1 var(--font-sans); color: var(--s1-blue);">2</span><span style="font: 600 15px/20px var(--font-sans);">Fill in + sign</span></div>
    <div class="s1-card" style="padding: 14px; display: flex; flex-direction: column; gap: 6px; align-items: center; text-align: center;"><span style="font: 700 13px/1 var(--font-sans); color: var(--s1-blue);">3</span><span style="font: 600 15px/20px var(--font-sans);">Show the desk</span></div>
  </div>
  <p style="margin: 0; font: 500 14px/20px var(--font-sans); color: var(--text-secondary); text-align: center;">Already a member? Scan to link your tag and get the app.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":780}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
