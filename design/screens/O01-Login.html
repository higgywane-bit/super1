<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>O01-Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../mockup/s1.css">
<link rel="stylesheet" href="../mockup/ds/super1/components/bundle.css">
<style>body{margin:0;background:#000}</style>
</head><body><div id="root">



<div class="s1 s1-screen" lang="en" style="font-family: var(--font-sans); color: #ffffff; background: #000000;">

  
  
    <div class="s1-tab-in" style="position: absolute; inset: 0; padding: 96px 24px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px;">
      <div style="position: relative; align-self: flex-start;">
        <span class="s1-bloom" style="position: absolute; right: -40px; top: -44px; width: 140px; height: 140px; border-radius: 50%; background: radial-gradient(circle, rgba(0,160,255,0.7) 0%, rgba(0,69,251,0) 70%);"></span>
        <img class="s1-wipe" src="../brand/super1-wordmark.png" alt="SUPER1" style="position: relative; height: 34px; width: auto; display: block;">
      </div>
      <span class="s1-pill" style="align-self: flex-start; color: var(--s1-blue); background: var(--s1-blue-tint);">Owner</span>
      
        <form class="s1-rise" style="display: flex; flex-direction: column; gap: 14px;">
          <h1 class="s1-largetitle" style="font-size: 30px; line-height: 36px;">Sign in</h1>
          <p style="margin: 0; font: 400 15px/22px var(--font-sans); color: var(--text-secondary);">Your numbers from Qashier and the front desk, on your phone. We email you a code, no password.</p>
          <div><label class="s1-label" for="o-email">Email</label><input class="s1-input" id="o-email" type="email" value="andy@superfitphuket.com" readonly="" style=""></div>
          <button class="s1-btn s1-btn--primary s1-btn--lg s1-btn--block" type="submit">Email me a code</button>
        </form>
      
      
      <div class="s1-seg" style="display: flex; align-self: flex-start; margin-top: auto;"><button type="button" aria-pressed="true" lang="en">English</button><button type="button" aria-pressed="false" lang="th">ไทย</button></div>
    </div>
  

  
  
</div>

</div></body></html>
