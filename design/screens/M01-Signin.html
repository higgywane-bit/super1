<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>M01-Signin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../mockup/s1.css">
<link rel="stylesheet" href="../mockup/ds/super1/components/bundle.css">
<style>body{margin:0;background:#000}</style>
</head><body><div id="root">



<div class="s1 s1-screen" lang="en" style="font-family: var(--font-sans); color: #ffffff; background: #000000;">

  
  

  
  
    <form class="s1-tab-in" style="position: absolute; inset: 0; padding: 64px 24px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <img src="../brand/super1-wordmark.png" alt="SUPER1" style="height: 26px; width: auto;">
        <div class="s1-seg"><button type="button" aria-pressed="true" lang="en" style="padding: 0 10px;">EN</button><button type="button" aria-pressed="false" lang="th" style="padding: 0 10px;">ไทย</button><button type="button" aria-pressed="false" lang="ru" style="padding: 0 10px;">RU</button></div>
      </div>
      <div style="margin-top: 72px; display: flex; flex-direction: column; gap: 10px;">
        <h1 class="s1-largetitle">Sign in</h1>
        <p style="margin: 0; font: 500 16px/24px var(--font-sans); color: var(--text-secondary);">Use the email you gave Superfit. We'll send you a 6-digit code.</p>
      </div>
      <div><label class="s1-label" for="m-email">Email</label><input class="s1-input" id="m-email" type="email" inputmode="email" autocomplete="email" value="emma.wilson@gmail.com" style=""></div>
      <button class="s1-btn s1-btn--primary s1-btn--lg s1-btn--block" type="submit">Send me a code</button>
      <p style="margin: auto 0 0; font: 500 14px/20px var(--font-sans); color: var(--text-secondary); text-align: center;">New to Superfit? Scan the QR at the counter.</p>
    </form>
  

  
  

  
  

  
  

  
  

  
  

  
  

  
  

  
  

  
  

  
  

  
  

  
  

  
  
</div>

</div></body></html>
