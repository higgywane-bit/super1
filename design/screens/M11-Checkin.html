<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>M11-Checkin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../mockup/s1.css">
<link rel="stylesheet" href="../mockup/ds/super1/components/bundle.css">
<style>body{margin:0;background:#000}</style>
</head><body><div id="root">



<div class="s1 s1-screen" lang="en" style="font-family: var(--font-sans); color: #ffffff; background: #000000;">

  
  

  
  

  
  

  
  

  
  

  
  

  
  

  
  

  
  

  
  

  
  

  
  
    <div class="s1-scrollbox s1-tab-in" style="padding: 52px 20px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 12px;"><button class="s1-btn s1-btn--secondary s1-btn--icon" type="button" aria-label="Back"><svg class="s1-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button><h1 class="s1-title2">Daily check-in</h1></div>
      
      
        <div class="s1-stagger" style="display: flex; flex-direction: column; gap: 12px;">
          <div class="s1-card" style="padding: 16px; display: flex; align-items: center; justify-content: space-between;">
            <span style="display: flex; flex-direction: column; gap: 2px;"><span class="s1-headline" style="font-size: 16px;">Sleep</span><span style="font: 500 13px/18px var(--font-sans); color: var(--text-secondary);">Hours last night</span></span>
            <span style="display: flex; align-items: center; gap: 10px;">
              <button class="s1-btn s1-btn--secondary s1-btn--icon" type="button" aria-label="−" style="width: 40px; height: 40px;"><svg class="s1-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
              <span class="s1-num" style="width: 44px; text-align: center; font: 700 20px/24px var(--font-sans);">7.0</span>
              <button class="s1-btn s1-btn--secondary s1-btn--icon" type="button" aria-label="+" style="width: 40px; height: 40px;"><svg class="s1-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
            </span>
          </div>
          <div class="s1-card" style="padding: 16px; display: flex; flex-direction: column; gap: 12px;">
            <span class="s1-headline" style="font-size: 16px;">Energy</span>
            <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px;"><button type="button" aria-pressed="false" class="s1-chip-off" style="height: 44px; border: 0; border-radius: 12px; font: 700 16px/1 var(--font-sans); cursor: pointer;">1</button><button type="button" aria-pressed="false" class="s1-chip-off" style="height: 44px; border: 0; border-radius: 12px; font: 700 16px/1 var(--font-sans); cursor: pointer;">2</button><button type="button" aria-pressed="false" class="s1-chip-off" style="height: 44px; border: 0; border-radius: 12px; font: 700 16px/1 var(--font-sans); cursor: pointer;">3</button><button type="button" aria-pressed="false" class="s1-chip-off" style="height: 44px; border: 0; border-radius: 12px; font: 700 16px/1 var(--font-sans); cursor: pointer;">4</button><button type="button" aria-pressed="false" class="s1-chip-off" style="height: 44px; border: 0; border-radius: 12px; font: 700 16px/1 var(--font-sans); cursor: pointer;">5</button></div>
          </div>
          <div class="s1-card" style="padding: 16px; display: flex; flex-direction: column; gap: 12px;">
            <span class="s1-headline" style="font-size: 16px;">Digestion</span>
            <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px;"><button type="button" aria-pressed="false" class="s1-chip-off" style="height: 44px; border: 0; border-radius: 12px; font: 700 16px/1 var(--font-sans); cursor: pointer;">1</button><button type="button" aria-pressed="false" class="s1-chip-off" style="height: 44px; border: 0; border-radius: 12px; font: 700 16px/1 var(--font-sans); cursor: pointer;">2</button><button type="button" aria-pressed="false" class="s1-chip-off" style="height: 44px; border: 0; border-radius: 12px; font: 700 16px/1 var(--font-sans); cursor: pointer;">3</button><button type="button" aria-pressed="false" class="s1-chip-off" style="height: 44px; border: 0; border-radius: 12px; font: 700 16px/1 var(--font-sans); cursor: pointer;">4</button><button type="button" aria-pressed="false" class="s1-chip-off" style="height: 44px; border: 0; border-radius: 12px; font: 700 16px/1 var(--font-sans); cursor: pointer;">5</button></div>
          </div>
          <div class="s1-card" style="padding: 16px; display: flex; flex-direction: column; gap: 12px;">
            <span style="display: flex; justify-content: space-between;"><span class="s1-headline" style="font-size: 16px;">Water</span><span style="font: 500 13px/18px var(--font-sans); color: var(--text-secondary);">Target 3 L</span></span>
            <div class="s1-seg" style="display: flex;"><button type="button" aria-pressed="false" style="flex: 1;">1.5 L</button><button type="button" aria-pressed="false" style="flex: 1;">2 L</button><button type="button" aria-pressed="false" style="flex: 1;">2.5 L</button><button type="button" aria-pressed="false" style="flex: 1;">3 L</button><button type="button" aria-pressed="false" style="flex: 1;">3.5 L</button></div>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
            <div class="s1-card" style="padding: 14px;"><label class="s1-label" for="m-steps" style="margin-left: 0;">Steps</label><input class="s1-input s1-num" id="m-steps" inputmode="numeric" placeholder="10,000" value="" style="height: 44px; background: var(--surface-3);"></div>
            <div class="s1-card" style="padding: 14px;"><label class="s1-label" for="m-weight" style="margin-left: 0;">Bodyweight kg</label><input class="s1-input s1-num" id="m-weight" inputmode="decimal" placeholder="61.8" value="" style="height: 44px; background: var(--surface-3);"></div>
          </div>
          <button class="s1-btn s1-btn--primary s1-btn--lg s1-btn--block s1-off" type="button">Complete</button>
        </div>
      
    </div>
  

  
  

  
  

  
  
</div>

</div></body></html>
