<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>C01-Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../mockup/s1.css">
<link rel="stylesheet" href="../mockup/ds/super1/components/bundle.css">
<style>body{margin:0;background:#000}</style>
</head><body><div id="root">



<div class="s1" lang="en" style="position: relative; min-height: 940px; width: 100%; background: #000000; color: #ffffff; font-family: var(--font-sans);">

  
  
    <div style="min-height: 940px; display: flex; flex-wrap: wrap;">
      <div style="flex: 1 1 560px; position: relative; min-height: 420px; overflow: hidden;">
        <img class="s1-photo" src="../photos/hero-coaches.jpg" alt="Superfit coaches on the gym floor" style="position: absolute; inset: 0;">
        <span style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 62%, #000000 100%);"></span>
        <div class="s1-rise-2" style="position: absolute; left: 48px; right: 48px; bottom: 56px; display: flex; flex-direction: column; gap: 14px;">
          <span class="s1-pill s1-pill--pt" style="align-self: flex-start;">super1.app/coach</span>
          <span style="max-width: 520px; font: 700 40px/46px var(--font-sans); letter-spacing: -0.02em; text-shadow: 0 2px 24px rgba(0,0,0,0.6);">Your clients, programs and sessions in one place.</span>
        </div>
      </div>
      <div style="flex: 1 1 440px; display: grid; place-items: center; padding: 48px 24px; box-sizing: border-box;">
        <div style="width: min(400px, 100%); display: flex; flex-direction: column; gap: 24px;">
          <div style="display: flex; align-items: center; gap: 12px;"><img class="s1-wipe" src="../brand/super1-wordmark.png" alt="SUPER1" style="height: 34px; width: auto;"><span class="s1-pill s1-pill--pt">Coach</span></div>
          
            <form class="s1-rise" style="display: flex; flex-direction: column; gap: 14px;">
              <h1 class="s1-title2" style="font-size: 28px; line-height: 34px;">Sign in</h1>
              <p style="margin: 0; font: 400 15px/22px var(--font-sans); color: var(--text-secondary);">Pete sets up your login. We email you a code, so there is no password to remember.</p>
              <div><label class="s1-label" for="c-email">Email</label><input class="s1-input" id="c-email" type="email" value="sunman@superfitphuket.com" readonly="" style=""></div>
              <button class="s1-btn s1-btn--primary s1-btn--lg s1-btn--block" type="submit">Email me a code</button>
            </form>
          
          
          <div class="s1-seg" style="display: flex; align-self: flex-start;"><button type="button" aria-pressed="true" lang="en">English</button><button type="button" aria-pressed="false" lang="th">ไทย</button></div>
        </div>
      </div>
    </div>
  

  
  

  
  

  
  

  
</div>

</div></body></html>
