<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>M02-Code</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../mockup/s1.css">
<link rel="stylesheet" href="../mockup/ds/super1/components/bundle.css">
<style>body{margin:0;background:#000}</style>
</head><body><div id="root">



<div class="s1 s1-screen" lang="en" style="font-family: var(--font-sans); color: #ffffff; background: #000000;">

  
  

  
  

  
  
    <div class="s1-tab-in" style="position: absolute; inset: 0; padding: 56px 24px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px;">
      <button class="s1-btn s1-btn--secondary s1-btn--icon" type="button" aria-label="Back"><svg class="s1-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
      <div style="margin-top: 32px; display: flex; flex-direction: column; gap: 10px;">
        <h1 class="s1-largetitle">Enter your code</h1>
        <p style="margin: 0; font: 500 16px/24px var(--font-sans); color: var(--text-secondary);">We sent 6 digits to <span style="color: #ffffff;">emma.wilson@gmail.com</span></p>
      </div>
      <label for="m-code" style="position: relative; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; cursor: text;">
        
          <span class="s1-num" style="height: 60px; border-radius: 14px; background: var(--surface-2); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); display: grid; place-items: center; font: 700 26px/1 var(--font-sans);">4</span>
        
          <span class="s1-num" style="height: 60px; border-radius: 14px; background: var(--surface-2); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); display: grid; place-items: center; font: 700 26px/1 var(--font-sans);">8</span>
        
          <span class="s1-num" style="height: 60px; border-radius: 14px; background: var(--surface-2); box-shadow: inset 0 0 0 2px #00b4ff; display: grid; place-items: center; font: 700 26px/1 var(--font-sans);"></span>
        
          <span class="s1-num" style="height: 60px; border-radius: 14px; background: var(--surface-2); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); display: grid; place-items: center; font: 700 26px/1 var(--font-sans);"></span>
        
          <span class="s1-num" style="height: 60px; border-radius: 14px; background: var(--surface-2); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); display: grid; place-items: center; font: 700 26px/1 var(--font-sans);"></span>
        
          <span class="s1-num" style="height: 60px; border-radius: 14px; background: var(--surface-2); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); display: grid; place-items: center; font: 700 26px/1 var(--font-sans);"></span>
        
        <input id="m-code" inputmode="numeric" autocomplete="one-time-code" aria-label="Enter your code" value="48" style="position: absolute; inset: 0px; opacity: 0; font-size: 16px;">
      </label>
      <button class="s1-link" type="button" style="align-self: flex-start;">Paste code from email</button>
      <span style="font: 500 14px/20px var(--font-sans); color: var(--text-tertiary);">The code works for 10 minutes.</span>
    </div>
  

  
  

  
  

  
  

  
  

  
  

  
  

  
  

  
  

  
  

  
  

  
  

  
  
</div>

</div></body></html>
