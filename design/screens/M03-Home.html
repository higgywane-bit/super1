<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>M03-Home</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../mockup/s1.css">
<link rel="stylesheet" href="../mockup/ds/super1/components/bundle.css">
<style>body{margin:0;background:#000}</style>
</head><body><div id="root">



<div class="s1 s1-screen" lang="en" style="font-family: var(--font-sans); color: #ffffff; background: #000000;">

  
  

  
  

  
  

  
  
    <div class="s1-scrollbox s1-tab-in" style="padding: 56px 20px 112px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px;">
      <header style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font: 600 14px/19px var(--font-sans); color: var(--text-secondary);">Good evening</span>
          <h1 class="s1-largetitle">Emma</h1>
        </div>
        <button type="button" aria-label="Me" class="s1-avatar" style="border: 0; width: 44px; height: 44px; cursor: pointer;">EW</button>
      </header>

      

      <div class="s1-card s1-slide-down" style="padding: 14px 16px; display: flex; align-items: center; gap: 12px;">
        <span class="s1-avatar" style="position: relative; width: 36px; height: 36px; background: var(--s1-pink-tint); color: var(--s1-pink); font-size: 12px;">SF<span class="s1-ping" style="position: absolute; right: -2px; top: -2px; width: 9px; height: 9px; border-radius: 50%; background: var(--s1-pink);"></span></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font: 600 15px/20px var(--font-sans);">Sunman sent your program</span><span style="font: 500 13px/18px var(--font-sans); color: var(--text-secondary);">Day A updated · bench press goes to 42.5 kg</span></span>
      </div>

      <button type="button" class="s1-card s1-tap" style="border: 0; text-align: left; cursor: pointer; padding: 22px; display: flex; flex-direction: column; gap: 14px; background: var(--s1-blue); color: #000000;">
        <span style="font: 600 13px/18px var(--font-sans); color: rgba(0,0,0,0.65);">Today</span>
        <span style="font: 700 30px/34px var(--font-sans); letter-spacing: -0.02em;">Day A · Push</span>
        <span style="display: flex; align-items: center; justify-content: space-between;"><span style="font: 500 15px/20px var(--font-sans);">5 · ~50 min</span><span style="display: inline-flex; align-items: center; gap: 6px; font: 700 16px/1 var(--font-sans);">Workout now<svg class="s1-icon" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px;"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></span></span>
      </button>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
        <button type="button" class="s1-card s1-tap" style="border: 0; text-align: left; cursor: pointer; padding: 16px; display: flex; flex-direction: column; gap: 8px; color: #ffffff;">
          <span class="s1-pill s1-pill--active" style="align-self: flex-start;">Active</span>
          <span class="s1-num" style="font: 700 28px/32px var(--font-sans); letter-spacing: -0.02em;">19</span>
          <span style="font: 500 13px/18px var(--font-sans); color: var(--text-secondary);">days left · 1 Month</span>
        </button>
        <div class="s1-card" style="padding: 16px; display: flex; flex-direction: column; gap: 8px;">
          <span class="s1-pill s1-pill--pt" style="align-self: flex-start;">PT</span>
          <span class="s1-num" style="font: 700 28px/32px var(--font-sans); letter-spacing: -0.02em;">6 / 10</span>
          <span style="font: 500 13px/18px var(--font-sans); color: var(--text-secondary);">sessions left with Sunman</span>
        </div>
      </div>

      <button type="button" class="s1-card s1-tap" style="border: 0; text-align: left; cursor: pointer; padding: 16px; display: flex; align-items: center; gap: 14px; color: #ffffff;">
        <span class="s1-disc s1-disc--warn"><svg class="s1-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 3px;"><span class="s1-headline" style="font-size: 16px;">Daily check-in</span><span style="font: 500 13px/18px var(--font-sans); color: var(--text-secondary);">Sleep, energy, water · 30 seconds</span></span>
        <svg class="s1-icon" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-secondary);"><path d="m9 18 6-6-6-6"></path></svg>
      </button>

      <button type="button" class="s1-card s1-tap" style="border: 0; text-align: left; cursor: pointer; padding: 16px; display: flex; flex-direction: column; gap: 12px; color: #ffffff;">
        <span style="display: flex; justify-content: space-between; width: 100%;"><span style="font: 600 13px/18px var(--font-sans); color: var(--text-secondary);">Today's targets</span><span class="s1-num" style="font: 600 13px/18px var(--font-sans);">1,735 kcal</span></span>
        <span style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 100%;">
          <span style="display: flex; flex-direction: column; gap: 2px;"><span class="s1-num" style="font: 700 20px/24px var(--font-sans);">130 g</span><span style="font: 500 12px/16px var(--font-sans); color: var(--text-secondary);">Protein</span></span>
          <span style="display: flex; flex-direction: column; gap: 2px;"><span class="s1-num" style="font: 700 20px/24px var(--font-sans);">180 g</span><span style="font: 500 12px/16px var(--font-sans); color: var(--text-secondary);">Carbs</span></span>
          <span style="display: flex; flex-direction: column; gap: 2px;"><span class="s1-num" style="font: 700 20px/24px var(--font-sans);">55 g</span><span style="font: 500 12px/16px var(--font-sans); color: var(--text-secondary);">Fat</span></span>
        </span>
      </button>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px;"><h2 class="s1-section" style="margin: 0 0 0 4px;">From the café</h2><button class="s1-link" type="button" style="font-size: 14px;">See menu</button></div>
      <div class="s1-hscroll s1-stagger" style="margin: 0 -20px; padding: 0 20px;">
        <button type="button" style="border: 0; padding: 0; cursor: pointer; width: 150px; text-align: left; background: transparent; color: #ffffff; display: flex; flex-direction: column; gap: 8px;"><span style="height: 150px; border-radius: 18px; overflow: hidden; background: var(--surface-2);"><img class="s1-photo" src="../photos/hero-cafe.jpg" alt="Protein shakes" style="object-position: 30% 50%;"></span><span style="font: 600 14px/19px var(--font-sans);">Strong Vibes</span><span class="s1-num" style="font: 500 13px/18px var(--font-sans); color: var(--text-secondary);">฿149</span></button>
        <button type="button" style="border: 0; padding: 0; cursor: pointer; width: 150px; text-align: left; background: transparent; color: #ffffff; display: flex; flex-direction: column; gap: 8px;"><span style="height: 150px; border-radius: 18px; overflow: hidden; background: var(--surface-2);"><img class="s1-photo" src="../photos/bulletproof-bruce.jpg" alt="Bulletproof Bruce"></span><span style="font: 600 14px/19px var(--font-sans);">Bulletproof Bruce</span><span class="s1-num" style="font: 500 13px/18px var(--font-sans); color: var(--text-secondary);">+฿70 on any coffee</span></button>
        <button type="button" style="border: 0; padding: 0; cursor: pointer; width: 150px; text-align: left; background: transparent; color: #ffffff; display: flex; flex-direction: column; gap: 8px;"><span style="height: 150px; border-radius: 18px; overflow: hidden; background: var(--surface-2);"><img class="s1-photo" src="../photos/flat-white.jpg" alt="Flat white"></span><span style="font: 600 14px/19px var(--font-sans);">Flat White</span><span class="s1-num" style="font: 500 13px/18px var(--font-sans); color: var(--text-secondary);">฿80</span></button>
      </div>
    </div>

          Home
        </button>

          <svg class="s1-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.4 14.4 9.6 9.6"></path><path d="M18.657 21.485a2 2 0 1 1-2.829-2.828l-1.767 1.768a2 2 0 1 1-2.829-2.829l6.364-6.364a2 2 0 1 1 2.829 2.829l-1.768 1.767a2 2 0 1 1 2.828 2.829z"></path><path d="m21.5 21.5-1.4-1.4"></path><path d="M3.9 3.9 2.5 2.5"></path><path d="M6.404 12.768a2 2 0 1 1-2.829-2.829l1.768-1.767a2 2 0 1 1-2.828-2.829l2.828-2.828a2 2 0 1 1 2.829 2.828l1.767-1.768a2 2 0 1 1 2.829 2.829z"></path></svg>
          
          
          Train
        </button>
      
        <button class="s1-tab" type="button" aria-pressed="false">
          
          
          <svg class="s1-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path><path d="M7 2v20"></path><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path></svg>

        </button>
      
        <button class="s1-tab" type="button" aria-pressed="false">
          
          
          
          <svg class="s1-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Me
        </button>

</div>
