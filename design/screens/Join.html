<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Join</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../mockup/s1.css">
<link rel="stylesheet" href="../mockup/ds/super1/components/bundle.css">
<style>body{margin:0;background:#000}</style>
</head><body><div id="root">

<div class="s1 s1-screen" lang="en">
  <div class="s1-scrollbox" style="padding: 56px 24px 32px; box-sizing: border-box; display: flex; flex-direction: column;">

    

    
      <div style="display: flex; flex-direction: column; gap: 28px; flex: 1;">
        <div class="s1-rise" style="display: flex; flex-direction: column; gap: 20px; padding-top: 40px;">
          <img class="s1-wipe" src="../brand/super1-wordmark.png" alt="SUPER1" style="height: 30px; width: auto; align-self: flex-start;">
          <h1 class="s1-largetitle" style="font-size: 38px; line-height: 44px;">Welcome to Superfit</h1>
          <p style="margin: 0; font: 500 16px/24px var(--font-sans); color: var(--text-secondary);">ยินดีต้อนรับ · Добро пожаловать</p>
        </div>
        <div class="s1-rise-2" style="display: flex; flex-direction: column; gap: 10px; margin-top: auto;">
          <p class="s1-section">Choose your language</p>
          
            <button class="s1-tile" type="button" aria-pressed="true" style="min-height: 64px; flex-direction: row; align-items: center;">
              <span class="s1-tile__name" lang="en">English</span>
              <svg class="s1-icon" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-secondary);"><path d="m9 18 6-6-6-6"></path></svg>
            </button>
          
            <button class="s1-tile" type="button" aria-pressed="false" style="min-height: 64px; flex-direction: row; align-items: center;">
              <span class="s1-tile__name" lang="th">ภาษาไทย</span>
              <svg class="s1-icon" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-secondary);"><path d="m9 18 6-6-6-6"></path></svg>
            </button>
          
            <button class="s1-tile" type="button" aria-pressed="false" style="min-height: 64px; flex-direction: row; align-items: center;">
              <span class="s1-tile__name" lang="ru">Русский</span>
              <svg class="s1-icon" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--text-secondary);"><path d="m9 18 6-6-6-6"></path></svg>
            </button>
          
        </div>
      </div>
    

    

    

    

    

    

    

    

  </div>
</div>
</div></body></html>
