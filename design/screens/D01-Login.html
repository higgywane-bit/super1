<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>D01-Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../mockup/s1.css">
<link rel="stylesheet" href="../mockup/ds/super1/components/bundle.css">
<style>body{margin:0;background:#000}</style>
</head><body><div id="root">



<div class="s1" lang="en" style="position: relative; min-height: 940px; width: 100%; background: #000000; color: #ffffff; font-family: var(--font-sans);">

  
    <div style="min-height: 940px; display: grid; place-items: center; padding: 40px 16px; box-sizing: border-box;">
      <div style="width: min(440px, 100%); display: flex; flex-direction: column; gap: 22px;">
        <div style="position: relative; align-self: center; margin-bottom: 8px;">
          <span class="s1-bloom" style="position: absolute; right: -44px; top: -46px; width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle, rgba(0,160,255,0.7) 0%, rgba(0,69,251,0) 70%);"></span>
          <img class="s1-wipe" src="../brand/super1-wordmark.png" alt="SUPER1" style="position: relative; height: 44px; width: auto; display: block;">
        </div>
        <p style="margin: 0; text-align: center; font: 500 14px/20px var(--font-sans); color: var(--text-secondary);">Front desk</p>
        
          <form class="s1-rise" style="display: flex; flex-direction: column; gap: 12px;">
            <div><label class="s1-label" for="d-email">Email</label><input class="s1-input" id="d-email" type="email" value="desk@superfitphuket.com" readonly="" style=""></div>
            <div><label class="s1-label" for="d-pass">Passcode</label><input class="s1-input" id="d-pass" type="password" value="••••••" readonly="" style=""></div>
            <button class="s1-btn s1-btn--primary s1-btn--lg s1-btn--block" type="submit" style="margin-top: 6px;">Sign in</button>
          </form>
        
        
      </div>
    </div>
  

  
</div>

</div></body></html>
